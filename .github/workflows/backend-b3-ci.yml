name: Backend B3 CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-b3-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-b3-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ENVIRONMENT: test
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: gate
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55441:5432
        options: >-
          --health-cmd "pg_isready -U gate -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run complete suite with disposable PostgreSQL gates
        env:
          DERMAIRE_LOCAL_PG_GATE: "55441"
        run: python -m pytest -q --basetemp=.pytest-tmp-b3-ci

      - name: Compile Backend
        run: python -m compileall -q app tests

      - name: Check patch whitespace
        working-directory: .
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --check "$PR_BASE_SHA"...HEAD

      - name: Verify OpenAPI inventory
        run: |
          python - <<'PY'
          from app.main import app
          schema = app.openapi()
          inventory = (
              len(schema["paths"]),
              len(schema.get("components", {}).get("schemas", {})),
          )
          assert inventory == (115, 119), inventory
          assert "/api/v1/auth/safety-policy" in schema["paths"]
          print(f"OpenAPI: {inventory[0]} paths / {inventory[1]} schemas")
          PY
