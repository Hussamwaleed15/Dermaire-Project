version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: dermaire_postgres
    restart: always
    environment:
      POSTGRES_USER: dermaire_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a unique database password}
      POSTGRES_DB: dermaire_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dermaire_user -d dermaire_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: dermaire_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:?Set a postgresql+psycopg URL matching the database credentials}
      - SECRET_KEY=${SECRET_KEY:?Set a unique production SECRET_KEY}
      - ENVIRONMENT=production
      - DEBUG=False
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads

volumes:
  postgres_data:
